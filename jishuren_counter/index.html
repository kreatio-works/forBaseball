<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>自主練カウンター</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* 素振りカウンターと同じ「スコアボード」の見た目。色はここだけで管理する */
  :root{
    --board:#0c1210;        /* スコアボードの盤面 */
    --board-deep:#080d0b;   /* 盤面のくぼみ */
    --board-line:#1c2a24;   /* 盤面の枠線 */
    --lamp:#ffb627;         /* 電光の数字 */
    --lamp-dim:#4a3a14;     /* 消灯ランプ */
    --chalk:#f2efe6;        /* チョークの白 */
    --clay:#b5652e;         /* 土の色（警告・停止） */
    --grass:#2e7d4f;        /* 芝（開始・達成） */
    --grass-lit:#58c487;    /* 達成の文字色 */
    --mute:#7a8a80;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--board);
    color:var(--chalk);
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    min-height:100dvh;
    user-select:none;-webkit-user-select:none;
  }
  .dot{font-family:"DotGothic16",monospace}
  button{font-family:inherit}
  .view{display:none;flex-direction:column;min-height:100dvh}
  .view.on{display:flex}

  header{
    padding:14px 16px 10px;
    border-bottom:2px solid var(--board-line);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  header .date{font-size:12px;color:var(--mute);letter-spacing:.08em}
  header .title{font-size:17px;color:var(--chalk);letter-spacing:.1em}
  .gear{
    background:none;border:1px solid var(--board-line);color:var(--mute);
    border-radius:6px;padding:7px 11px;font-size:12px;
  }

  /* ===== ホーム：きょうの進み具合 ===== */
  .summary{
    padding:16px;border-bottom:2px solid var(--board-line);
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  }
  .summary .lbl{font-size:10px;color:var(--mute);letter-spacing:.2em;margin-bottom:4px;white-space:nowrap}
  .summary .big{font-size:44px;line-height:1;color:var(--lamp);text-shadow:0 0 14px rgba(255,182,39,.3)}
  .summary .big small{font-size:18px;color:var(--mute)}
  .all-done .summary .big{color:var(--grass-lit);text-shadow:0 0 16px rgba(88,196,135,.45)}
  .week{display:flex;gap:4px}
  .week .d{
    width:30px;padding:4px 0 5px;text-align:center;border-radius:6px;
    background:var(--board-deep);border:1px solid var(--board-line);
  }
  .week .w{font-size:9px;color:var(--mute)}
  .week .n{font-size:13px;color:var(--lamp-dim)}
  .week .d.some .n{color:var(--lamp)}
  .week .d.full{border-color:var(--grass)}
  .week .d.full .n{color:var(--grass-lit)}
  .week .d.today{outline:1px solid var(--mute);outline-offset:1px}

  .menu{flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
  .item{
    width:100%;text-align:left;color:var(--chalk);
    background:var(--board-deep);border:2px solid var(--board-line);border-radius:12px;
    padding:12px 14px 10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;
  }
  .item .name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
  .item .tag{
    font-size:10px;font-weight:400;color:var(--mute);border:1px solid var(--board-line);
    border-radius:4px;padding:1px 5px;letter-spacing:.05em;
  }
  .item .nums{font-size:22px;color:var(--lamp);white-space:nowrap}
  .item .nums small{font-size:13px;color:var(--mute)}
  .item .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--lamp-dim);overflow:hidden}
  .item .bar i{display:block;height:100%;background:var(--lamp);width:0}
  .item.done{border-color:var(--grass)}
  .item.done .nums{color:var(--grass-lit)}
  .item.done .bar{background:#16352a}
  .item.done .bar i{background:var(--grass-lit)}
  .item.rest{opacity:.5}
  .item:focus-visible,.gear:focus-visible,button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
  input{user-select:text;-webkit-user-select:text}
  #weekBtn{background:none;border:none;color:inherit;text-align:right;padding:0}
  #weekBtn .lbl::after{content:" ›";color:var(--lamp)}

  /* きょうのひとこと */
  .memo{padding:4px 16px 10px}
  .memo label{display:block;font-size:10px;color:var(--mute);letter-spacing:.2em;margin-bottom:6px}
  .memo-row{display:flex;gap:8px}
  .memo input{
    flex:1;min-width:0;background:var(--board-deep);border:2px solid var(--board-line);border-radius:10px;
    padding:11px 12px;color:var(--chalk);font-size:16px;font-family:inherit;
  }
  .memo button{background:#243530;border:none;border-radius:10px;padding:0 16px;color:var(--chalk);font-size:14px;font-weight:700}
  #memoMsg{font-size:11px;color:var(--grass-lit);min-height:16px;margin-top:4px}

  /* 1週間の記録 */
  .wk-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:2px solid var(--board-line)}
  .wk-nav .range{font-size:15px;color:var(--lamp);text-align:center}
  .wk-nav .sub{font-size:11px;color:var(--mute);text-align:center;margin-top:2px}
  /* グラフ（文字の色は文字用トークン、色は 進み具合＝ランプ色／達成＝緑 の2役だけ） */
  .wk-charts{padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
  .card{background:var(--board-deep);border:2px solid var(--board-line);border-radius:12px;padding:12px}
  .card h3{font-size:10px;font-weight:400;color:var(--mute);letter-spacing:.2em;margin-bottom:10px}
  .top-row{display:flex;gap:14px;align-items:stretch}
  .ring{flex:0 0 104px;display:flex;flex-direction:column;align-items:center}
  .ring svg{width:104px;height:104px;display:block}
  .ring .trk{stroke:var(--lamp-dim)}
  .ring .prg{stroke:var(--lamp)}
  .ring.full .prg{stroke:var(--grass-lit)}
  .ring text{fill:var(--chalk);font-family:"DotGothic16",monospace}
  .ring .cap{font-size:11px;color:var(--mute);margin-top:4px;text-align:center}
  .daybars{flex:1;min-width:0;display:flex;flex-direction:column}
  .db{flex:1;display:flex;gap:5px;align-items:flex-end}
  .db-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  .db-val{font-size:10px;color:var(--chalk);font-family:"DotGothic16",monospace;min-height:12px}
  .db-trk{width:100%;height:68px;border-radius:4px;background:#141d19;display:flex;align-items:flex-end;overflow:hidden}
  .db-fill{width:100%;background:var(--lamp);border-radius:4px 4px 0 0;min-height:0}
  .db-col.full .db-fill{background:var(--grass-lit)}
  .db-col.rest .db-trk{background:none;border:1px dashed var(--board-line)}
  .db-col.future .db-trk{opacity:.45}
  .db-wd{font-size:11px;color:var(--mute)}
  .db-col.today .db-wd{color:var(--chalk);font-weight:700}
  .ib{margin-bottom:9px}
  .ib:last-child{margin-bottom:0}
  .ib-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-bottom:4px}
  .ib-val{font-size:12px;color:var(--chalk);font-family:"DotGothic16",monospace;white-space:nowrap}
  .ib-val small{color:var(--mute);font-size:11px}
  .ib-trk{height:8px;border-radius:4px;background:#141d19;overflow:hidden}
  .ib-fill{height:100%;background:var(--lamp);border-radius:4px}
  .ib.full .ib-fill{background:var(--grass-lit)}
  .trend svg{width:100%;height:auto;display:block}
  .trend .grid{stroke:var(--board-line);stroke-width:1}
  .trend .line{fill:none;stroke:var(--lamp);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .trend .area{fill:var(--lamp);opacity:.12}
  .trend .pt{fill:var(--lamp);stroke:var(--board-deep);stroke-width:2}
  .trend .pt.sel{fill:var(--chalk)}
  .trend text{fill:var(--mute);font-size:10px;font-family:"DotGothic16",monospace}
  .trend text.v{fill:var(--chalk);font-size:11px}
  .trend .hit{fill:transparent;cursor:pointer}
  .chart-note{font-size:12px;color:var(--mute)}

  .wk-list{flex:1;padding:12px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
  .wk-day{background:var(--board-deep);border:2px solid var(--board-line);border-radius:12px;padding:10px 12px}
  .wk-day.full{border-color:var(--grass)}
  .wk-day.today{outline:1px solid var(--mute);outline-offset:2px}
  .wk-day.future{opacity:.4}
  .wk-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .wk-date{font-size:15px}
  .wk-stat{font-size:15px;color:var(--lamp)}
  .wk-day.full .wk-stat{color:var(--grass-lit)}
  .wk-items{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:8px}
  .chip{font-size:12px;border:1px solid var(--board-line);border-radius:6px;padding:3px 7px;color:var(--chalk);white-space:nowrap}
  .chip b{font-weight:400;color:var(--lamp);font-family:"DotGothic16",monospace;margin-left:4px}
  .chip.ok{border-color:var(--grass)}
  .chip.ok b{color:var(--grass-lit)}
  .chip.zero{color:var(--mute)}
  .chip.zero b{color:var(--lamp-dim)}
  .wk-rest{font-size:12px;color:var(--mute);margin-top:6px}
  .wk-memo{font-size:13px;color:var(--chalk);margin-top:8px;padding-top:8px;border-top:1px dashed var(--board-line);overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
  .wk-memo::before{content:"ひとこと　";font-size:10px;color:var(--mute);letter-spacing:.1em}

  .foot-note{font-size:11px;color:var(--mute);text-align:center;padding:4px 16px calc(16px + env(safe-area-inset-bottom))}

  /* ===== カウント画面 ===== */
  .goalbar{display:flex;gap:8px;padding:12px 16px;border-bottom:2px solid var(--board-line)}
  .goalbar .cell{
    flex:1;background:var(--board-deep);border:1px solid var(--board-line);
    border-radius:8px;padding:8px 10px;text-align:center;
  }
  .cell .lbl{font-size:10px;color:var(--mute);letter-spacing:.15em;margin-bottom:2px}
  .cell .num{font-size:22px;color:var(--lamp)}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 16px}
  .count-panel{
    width:100%;max-width:420px;background:var(--board-deep);
    border:2px solid var(--board-line);border-radius:14px;
    padding:18px 12px 10px;text-align:center;
    box-shadow:inset 0 0 40px rgba(0,0,0,.6);
  }
  .count-panel .lbl{font-size:11px;color:var(--mute);letter-spacing:.3em}
  #count{
    font-size:min(38vw,150px);line-height:1.05;color:var(--lamp);
    text-shadow:0 0 18px rgba(255,182,39,.35);
  }
  #count.flash{animation:flash .25s}
  @keyframes flash{50%{color:#fff;text-shadow:0 0 30px rgba(255,255,255,.8)}}
  .goal-done #count{color:var(--grass-lit);text-shadow:0 0 22px rgba(88,196,135,.5)}
  .status{
    margin-top:8px;min-height:20px;font-size:13px;color:var(--mute);
    display:flex;justify-content:center;align-items:center;gap:8px;
  }
  .mic-dot{width:9px;height:9px;border-radius:50%;background:var(--lamp-dim);display:inline-block}
  .mic-dot.on{background:#e05252;animation:blink 1.2s infinite}
  .tap-mode .mic-dot{display:none}
  @keyframes blink{50%{opacity:.3}}
  #heard{font-size:12px;color:#556158;margin-top:4px;min-height:16px}
  .goal-msg{margin-top:10px;font-size:18px;color:var(--grass-lit);letter-spacing:.2em;visibility:hidden}
  .goal-done .goal-msg{visibility:visible;animation:blink 1s infinite}

  footer{padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
  .btn-row{display:flex;gap:10px;margin-bottom:10px}
  button.big{
    flex:1;border:none;border-radius:12px;
    padding:16px 8px;font-size:17px;font-weight:700;color:#fff;
  }
  #startBtn{background:var(--grass)}
  #startBtn.stop{background:var(--clay)}
  .tap-mode #startBtn{padding:26px 8px;font-size:21px}
  #plusBtn,#minusBtn{background:#243530;color:var(--chalk);flex:0 0 70px}
  .tap-mode #plusBtn{display:none}
  button:disabled{opacity:.35}
  #finishBtn{
    width:100%;background:none;border:2px solid var(--board-line);
    border-radius:12px;padding:13px;font-size:15px;color:var(--chalk);
  }
  #discardBtn,#resetBtn{
    width:100%;background:none;border:none;margin-top:10px;
    font-size:13px;color:var(--mute);text-decoration:underline;
  }
  .note{font-size:11px;color:var(--mute);text-align:center;margin-top:8px}

  /* ===== 設定・履歴 ===== */
  dialog{
    background:var(--board);color:var(--chalk);
    border:2px solid var(--board-line);border-radius:14px;
    width:min(92vw,420px);max-height:88dvh;padding:18px;margin:auto;overflow-y:auto;
  }
  dialog::backdrop{background:rgba(0,0,0,.7)}
  dialog h2{font-size:15px;margin-bottom:12px;letter-spacing:.1em}
  dialog h3{font-size:12px;color:var(--mute);font-weight:400;margin:16px 0 6px;letter-spacing:.1em}
  dialog label{font-size:12px;color:var(--mute);display:block;margin:10px 0 4px}
  dialog input{
    width:100%;background:var(--board-deep);border:1px solid var(--board-line);
    border-radius:8px;padding:10px;color:var(--chalk);font-size:16px;
  }
  .dlg-head{
    position:sticky;top:-18px;z-index:1;margin:-18px -18px 6px;padding:12px 18px;
    background:var(--board);border-bottom:1px solid var(--board-line);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .dlg-head h2{margin:0}
  .close-top{background:#243530;border:none;border-radius:8px;padding:9px 12px;color:var(--chalk);font-size:13px;white-space:nowrap}
  /* 種目の編集カード（タップで開く） */
  .ed{border:1px solid var(--board-line);border-radius:10px;background:var(--board-deep);margin-bottom:8px}
  .ed summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;font-size:14px}
  .ed summary::-webkit-details-marker{display:none}
  .ed .sname{font-weight:700;overflow-wrap:anywhere}
  .ed .ssum{font-size:11px;color:var(--mute);white-space:nowrap}
  .ed .ssum::after{content:"　編集";color:var(--lamp)}
  .ed[open] .ssum::after{content:"　とじる"}
  .ed .body{padding:0 12px 12px;border-top:1px solid var(--board-line)}
  .ed input{background:var(--board)}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .grid3 input{text-align:center;padding:10px 4px}
  .days,.seg{display:flex;gap:4px}
  .days button,.seg button{
    flex:1;padding:8px 0;border-radius:6px;font-size:12px;
    border:1px solid var(--board-line);background:var(--board);color:#56635b;
  }
  .days button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:#243530;color:var(--chalk);border-color:var(--grass)}
  .ed .del{margin-top:14px;width:100%;background:none;border:1px solid var(--clay);border-radius:8px;padding:9px;color:var(--clay);font-size:13px}
  .add{width:100%;background:none;border:1px dashed var(--mute);border-radius:10px;padding:12px;color:var(--chalk);font-size:14px}
  .empty{color:var(--mute);font-size:13px;text-align:center;padding:30px 0}
  dialog .close{margin-top:16px;width:100%;background:#243530;border:none;
    border-radius:10px;padding:12px;color:var(--chalk);font-size:14px}
  .hist{font-size:12px;color:var(--mute);max-height:26vh;overflow-y:auto}
  .hist div{padding:4px 0;border-bottom:1px solid var(--board-line)}
  .hist .unsent{color:var(--clay)}

  @media (prefers-reduced-motion:reduce){
    #count.flash,.mic-dot.on,.goal-done .goal-msg{animation:none}
  }
</style>
</head>
<body>

<!-- ===================== ホーム ===================== -->
<section class="view on" id="homeView">
  <header>
    <div>
      <div class="title dot">自主練カウンター</div>
      <div class="date dot" id="dateLabel"></div>
    </div>
    <button class="gear" id="gearBtn">設定</button>
  </header>

  <div class="summary">
    <div>
      <div class="lbl dot">おわった種目</div>
      <div class="big dot"><span id="doneCount">0</span><small> / <span id="itemCount">6</span></small></div>
    </div>
    <button id="weekBtn" type="button" aria-label="1週間の記録を見る">
      <div class="lbl dot">この1週間</div>
      <div class="week" id="week"></div>
    </button>
  </div>

  <div class="menu" id="menu"></div>
  <div class="memo">
    <label class="dot" for="memoInput">きょうのひとこと</label>
    <div class="memo-row">
      <input id="memoInput" type="text" maxlength="60" placeholder="例：バッティングセンターで100本" autocomplete="off">
      <button id="memoBtn" type="button">記録</button>
    </div>
    <div id="memoMsg"></div>
  </div>
  <div class="foot-note">種目をえらんでスタート。とちゅうで分けてやってもOK</div>
</section>

<!-- ===================== 1週間の記録 ===================== -->
<section class="view" id="weekView">
  <header>
    <button class="gear" id="weekBack">← もどる</button>
    <div class="title dot">1週間の記録</div>
    <span style="width:64px"></span>
  </header>
  <div class="wk-nav">
    <button class="gear" id="weekPrev">‹ 前の週</button>
    <div>
      <div class="range dot" id="weekRange"></div>
      <div class="sub" id="weekSub"></div>
    </div>
    <button class="gear" id="weekNext">次の週 ›</button>
  </div>
  <div class="wk-charts" id="weekCharts"></div>
  <div class="wk-list" id="weekList"></div>
</section>

<!-- ===================== カウント画面 ===================== -->
<section class="view" id="countView">
  <header>
    <button class="gear" id="backBtn">← もどる</button>
    <div class="title dot" id="itemTitle"></div>
    <span style="width:64px"></span>
  </header>

  <div class="goalbar">
    <div class="cell"><div class="lbl dot">目標</div><div class="num dot" id="goalNum">0</div></div>
    <div class="cell"><div class="lbl dot">きょうの合計</div><div class="num dot" id="todayTotal">0</div></div>
    <div class="cell"><div class="lbl dot">あと</div><div class="num dot" id="remain">0</div></div>
  </div>

  <main>
    <div class="count-panel">
      <div class="lbl dot">COUNT</div>
      <div class="dot" id="count">0</div>
      <div class="status">
        <span class="mic-dot" id="micDot"></span>
        <span id="statusText"></span>
      </div>
      <div id="heard"></div>
      <div class="goal-msg dot">★ 目標たっせい！ ★</div>
    </div>
  </main>

  <footer>
    <div class="btn-row">
      <button class="big" id="startBtn">スタート</button>
      <button class="big" id="plusBtn" disabled>+1</button>
      <button class="big" id="minusBtn" disabled>−1</button>
    </div>
    <button id="finishBtn" disabled>終了して記録する</button>
    <button id="discardBtn" hidden>記録せずにやり直す</button>
    <button id="resetBtn" hidden>きょうの記録を0回に戻す</button>
    <div class="note" id="note"></div>
  </footer>
</section>

<dialog id="settingsDlg">
  <div class="dlg-head">
    <h2>設定（おうちの人用）</h2>
    <button class="close-top" id="closeTop">保存して閉じる</button>
  </div>
  <label for="nickName">ニックネーム（チームで使うとき）</label>
  <input id="nickName" type="text" placeholder="例：たろう">
  <label for="gasUrl">記録送信先URL（GASウェブアプリ）</label>
  <input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec">

  <h3>メニュー（種目をタップして編集）</h3>
  <div id="menuEdit"></div>
  <button class="add" id="addItem" type="button">＋ 種目を追加</button>

  <h3>さいきんの記録</h3>
  <div class="hist" id="histList"></div>
  <button class="close" id="closeDlg">保存して閉じる</button>
</dialog>

<script>
(() => {
  'use strict';

  // ===== メニュー定義 =====
  // mode: 'voice' = 声で「いち、に…」と数える ／ 'tap' = 1本ごとにボタンを押す
  // intv: カウントの最短間隔（秒）。これより速い声・タップは無効（ズル防止）
  // ※ ここは「はじめて開いたときの初期メニュー」。名前・目標・数え方・曜日の変更や、
  //    種目の追加・削除は設定画面からできる（保存後は端末内のメニューが優先される）
  //    やる曜日（days）は [日,月,火,水,木,金,土] の順で 1=やる / 0=休み。初期値は毎日
  const DEFAULT_MENU = [
    { id:'fukkin', name:'腹筋',         unit:'回', goal:30,  mode:'voice', intv:1.2 },
    { id:'haikin', name:'背筋',         unit:'回', goal:30,  mode:'voice', intv:1.2 },
    { id:'ude',    name:'腕立て',       unit:'回', goal:30,  mode:'voice', intv:1.2 },
    { id:'dash',   name:'ダッシュ',     unit:'本', goal:10,  mode:'tap',   intv:10  },
    { id:'saka',   name:'坂道ダッシュ', unit:'本', goal:10,  mode:'tap',   intv:10  },
    { id:'suburi', name:'素振り',       unit:'回', goal:200, mode:'voice', intv:1.2 },
  ];

  // ===== 保存先（端末内）=====
  // 素振りカウンター（sb_〜）と同じサイトに置いても混ざらないよう、jr_ で始める
  const LS = {
    day:  d => 'jr_day_' + d,   // その日の種目別合計 {id: 回数}
    memo: d => 'jr_memo_' + d,  // その日のひとこと（文字列）
    menu: 'jr_menu',            // メニュー全体 [{id,name,unit,goal,mode,intv,days}]（旧形式 {id:{goal,intv,days}} も読める）
    hist: 'jr_history',         // セッション履歴（直近200件）
    gas:  'jr_gas_url',
    name: 'jr_name',
  };
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch(e) { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch(e) {} },
    json(k, fallback) { try { return JSON.parse(this.get(k, '') || 'null') || fallback; } catch(e) { return fallback; } },
  };

  const $ = id => document.getElementById(id);
  const WD = '日月火水木金土';
  const pad = n => String(n).padStart(2, '0');
  const dateKey = dt => dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
  const todayKey = () => dateKey(new Date());
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // 保存されたメニューの欠けや不正な値を補う
  function normItem(m) {
    const g = parseInt(m.goal, 10), iv = parseFloat(m.intv);
    return {
      id: String(m.id),
      name: String(m.name || '').trim() || '種目',
      unit: String(m.unit || '').trim() || '回',
      goal: g > 0 ? g : 10,
      mode: m.mode === 'tap' ? 'tap' : 'voice',
      intv: iv >= 0.5 ? iv : 1.2,
      days: Array.isArray(m.days) && m.days.length === 7 ? m.days.map(x => x ? 1 : 0) : [1,1,1,1,1,1,1],
    };
  }
  function getMenu() {
    const raw = store.json(LS.menu, null);
    if (Array.isArray(raw)) return raw.map(normItem);
    const ov = raw || {};   // 旧形式（初期メニューへの上書き）
    return DEFAULT_MENU.map(m => normItem(Object.assign({}, m, ov[m.id] || {})));
  }
  const dayTotals = d => store.json(LS.day(d), {});
  const dueOn = (m, dt) => !!m.days[dt.getDay()];   // その日が「やる曜日」か
  // その日の「やる種目の数」と「そのうち目標に届いた数」
  function dayStat(dt, menu) {
    const t = dayTotals(dateKey(dt));
    const due = menu.filter(m => dueOn(m, dt));
    return { due: due.length, done: due.filter(m => (t[m.id] || 0) >= m.goal).length };
  }

  // ===== 状態 =====
  let item = null;      // いま開いている種目
  let session = null;   // {start, count(音声), manual(手動・タップ), lastCountAt}
  let recog = null;
  let recogActive = false;
  let wakeLock = null;

  // ===== ホーム表示 =====
  function renderHome() {
    const menu = getMenu();
    const d = todayKey();
    const t = dayTotals(d);
    const n = new Date();
    $('dateLabel').textContent = n.getFullYear() + '/' + (n.getMonth() + 1) + '/' + n.getDate() + '（' + '日月火水木金土'[n.getDay()] + '）';

    const st = dayStat(n, menu);
    $('doneCount').textContent = st.done;
    $('itemCount').textContent = st.due;
    $('homeView').classList.toggle('all-done', st.due > 0 && st.done === st.due);

    // きょうやる種目を上に、お休みの種目は下にうすく表示（お休みの日でも記録はできる）
    const row = m => {
      const v = t[m.id] || 0;
      const due = dueOn(m, n);
      const pct = Math.min(100, Math.round(v / m.goal * 100));
      return '<button class="item' + (v >= m.goal ? ' done' : '') + (due ? '' : ' rest') + '" data-id="' + m.id + '">' +
        '<span class="name">' + esc(m.name) + '<span class="tag">' + (due ? (m.mode === 'voice' ? '声でカウント' : 'タップ') : 'きょうはお休み') + '</span></span>' +
        '<span class="nums dot">' + v + '<small> / ' + m.goal + m.unit + (v >= m.goal ? ' 済' : '') + '</small></span>' +
        '<span class="bar"><i style="width:' + pct + '%"></i></span></button>';
    };
    $('menu').innerHTML = (menu.filter(m => dueOn(m, n)).map(row).join('') + menu.filter(m => !dueOn(m, n)).map(row).join(''))
      || '<div class="empty">種目がありません。「設定」から追加してください</div>';

    // この1週間（きょうを右端に、その日やる種目をいくつ終えたか）
    let html = '';
    for (let i = 6; i >= 0; i--) {
      const dt = new Date(n.getFullYear(), n.getMonth(), n.getDate() - i);
      const c = dayStat(dt, menu);
      html += '<div class="d' + (c.due > 0 && c.done === c.due ? ' full' : c.done > 0 ? ' some' : '') + (i === 0 ? ' today' : '') + '">' +
        '<div class="w">' + '日月火水木金土'[dt.getDay()] + '</div><div class="n dot">' + c.done + '</div></div>';
    }
    $('week').innerHTML = html;

    // きょうのひとこと（入力中は上書きしない）
    if (document.activeElement !== $('memoInput')) $('memoInput').value = store.get(LS.memo(d), '');
  }

  function show(view) {
    $('homeView').classList.toggle('on', view === 'home');
    $('countView').classList.toggle('on', view === 'count');
    $('weekView').classList.toggle('on', view === 'week');
    window.scrollTo(0, 0);
  }

  // ===== カウント画面の表示 =====
  const idleText = () => item.mode === 'voice' ? '「スタート」を押して、数えながらやろう' : '「スタート」を押してからはじめよう';

  function openItem(id) {
    item = getMenu().find(m => m.id === id);
    if (!item) return;
    $('itemTitle').textContent = item.name;
    $('countView').classList.toggle('tap-mode', item.mode === 'tap');
    $('note').textContent = item.mode === 'voice'
      ? '声で「いち、に、さん…」と数える／「まちがい」で1つもどる'
      : '1' + item.unit + 'おわるたびに大きいボタンを押す／−1で1つもどる';
    resetUI();
    refreshTop();
    show('count');
  }

  function refreshTop() {
    const total = dayTotals(todayKey())[item.id] || 0;
    const live = total + (session ? session.count + session.manual : 0);
    $('goalNum').textContent = item.goal;
    $('todayTotal').textContent = live;
    $('remain').textContent = Math.max(0, item.goal - live);
    $('countView').classList.toggle('goal-done', live >= item.goal);
    // カウント中は「やり直す」、止まっているときは「0回に戻す」（記録があるときだけ）を出す
    $('discardBtn').hidden = !session;
    $('resetBtn').hidden = !!session || total === 0;
  }

  function setCount(flash) {
    $('count').textContent = session.count + session.manual;
    if (flash) {
      $('count').classList.remove('flash');
      void $('count').offsetWidth;
      $('count').classList.add('flash');
    }
    refreshTop();
  }

  // ===== 数字の聞き取り =====
  const KD = {'〇':0,'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  // 漢数字（〜九百九十九）を数に直す
  function kanjiToNum(s) {
    let total = 0, cur = 0;
    for (const ch of s) {
      if (ch === '百') { total += (cur || 1) * 100; cur = 0; }
      else if (ch === '十') { total += (cur || 1) * 10; cur = 0; }
      else cur = KD[ch];
    }
    return total + cur;
  }
  // 聞こえた文から数の候補を取り出す。next は「次に来るはずの数」
  function extractNumbers(text, next) {
    const out = [];
    (text.match(/\d+/g) || []).forEach(s => {
      out.push(parseInt(s, 10));
      // 「28 29」が「2829」とつながって聞こえたとき：末尾が次の数ならそれを拾う
      const ns = String(next);
      if (s.length > ns.length && s.endsWith(ns)) out.push(next);
    });
    (text.match(/[〇零一二三四五六七八九十百]+/g) || []).forEach(s => out.push(kanjiToNum(s)));
    return out.filter(n => Number.isInteger(n) && n > 0 && n < 10000);
  }

  // 聞き取った数字をカウントに反映（ズル防止ルールつき）
  function applyNumber(n) {
    if (!session) return;
    const now = Date.now();
    const cur = session.count;
    const sinceLast = (now - session.lastCountAt) / 1000;
    const elapsed   = (now - session.start) / 1000;

    if (n === cur + 1) {
      // 通常の+1：最短間隔チェック
      if (sinceLast >= item.intv) { session.lastCountAt = now; session.count = n; setCount(true); }
    } else if (n > cur + 1 && n <= cur + 3) {
      // 認識が数回抜けたときの追いつき：経過時間が妥当なときだけ許可
      if (elapsed >= n * item.intv * 0.8) { session.lastCountAt = now; session.count = n; setCount(true); }
    }
    // それ以外（大ジャンプ・巻き戻し）は無視 ＝ 「100！」と叫んでも飛ばない
  }

  // 1つ戻す（連続で戻りすぎないよう2秒のクールダウン）
  let lastUndoAt = 0;
  function undoOne() {
    if (!session) return;
    const now = Date.now();
    if (now - lastUndoAt < 2000) return;
    if (session.manual > 0) session.manual--;
    else if (session.count > 0) session.count--;
    else return;
    lastUndoAt = now;
    setCount(true);
    $('statusText').textContent = '1つもどしました';
  }

  // ===== 音声認識 =====
  function startRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { $('statusText').textContent = 'このブラウザは音声認識に未対応です（+1ボタンで使えます）'; return; }
    recog = new SR();
    recog.lang = 'ja-JP';
    recog.continuous = true;
    recog.interimResults = true;

    recog.onresult = ev => {
      let latest = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        latest += t;
        // 確定した認識結果に「まちがい」があれば1つ戻す
        if (ev.results[i].isFinal && /まちがい|間違い/.test(t)) undoOne();
      }
      $('heard').textContent = '聞こえた声：' + latest.slice(-20);
      if (session) extractNumbers(latest, session.count + 1).forEach(applyNumber);
    };
    recog.onstart = () => { $('micDot').classList.add('on'); };
    recog.onend = () => {
      $('micDot').classList.remove('on');
      // セッション中は自動で再起動（iOSは認識が勝手に切れるため）
      const r = recog;
      if (recogActive && r) { try { r.start(); } catch(e) { setTimeout(() => { if (recogActive && recog === r) { try { r.start(); } catch(e2) {} } }, 400); } }
    };
    recog.onerror = e => { if (e.error === 'not-allowed') { $('statusText').textContent = 'マイクの許可が必要です'; recogActive = false; } };

    recogActive = true;
    try { recog.start(); } catch(e) {}
  }

  function stopRecognition() {
    recogActive = false;
    if (recog) { try { recog.stop(); } catch(e) {} recog = null; }
    $('micDot').classList.remove('on');
  }

  // ===== 画面スリープ防止 =====
  async function acquireWakeLock() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && session) acquireWakeLock();
  });

  // ===== セッション =====
  function startSession() {
    session = { start: Date.now(), count: 0, manual: 0, lastCountAt: Date.now() - (item.mode === 'voice' ? 60000 : 0) };
    $('count').textContent = '0';
    $('minusBtn').disabled = false;
    $('finishBtn').disabled = false;
    if (item.mode === 'voice') {
      $('startBtn').textContent = 'ストップ';
      $('startBtn').classList.add('stop');
      $('plusBtn').disabled = false;
      $('statusText').textContent = '数えながらやろう！';
      startRecognition();
    } else {
      $('startBtn').textContent = '1' + item.unit + ' おわった！';
      $('statusText').textContent = '1' + item.unit + 'おわったらボタンを押そう';
    }
    acquireWakeLock();
    refreshTop();
  }

  function pauseSession() {
    stopRecognition();
    $('startBtn').textContent = 'さいかい';
    $('startBtn').classList.remove('stop');
    $('statusText').textContent = 'きゅうけい中';
  }

  function resumeSession() {
    $('startBtn').textContent = 'ストップ';
    $('startBtn').classList.add('stop');
    $('statusText').textContent = '数えながらやろう！';
    startRecognition();
  }

  // タップ・+1ボタン共通：最短間隔より速い連打は無効
  function manualPlus() {
    if (!session) return;
    const now = Date.now();
    const wait = item.intv - (now - session.lastCountAt) / 1000;
    if (wait > 0) {
      if (item.mode === 'tap') $('statusText').textContent = 'まだ早いよ（あと' + Math.ceil(wait) + '秒）';
      return;
    }
    session.lastCountAt = now;
    session.manual++;
    setCount(true);
    if (item.mode === 'tap') $('statusText').textContent = session.manual + item.unit + '目 OK！';
  }

  async function finishSession() {
    if (!session) return;
    const total = session.count + session.manual;
    if (total === 0) { resetUI(); return; }
    if (!confirm(item.name + ' ' + total + item.unit + 'で記録します。いいですか？')) return;

    stopRecognition();

    // チーム運用（送信先あり）でニックネーム未設定なら聞く
    let name = store.get(LS.name, '');
    if (!name && store.get(LS.gas, '')) {
      name = (prompt('ニックネームを入れてね（コーチへの報告に表示されます）') || '').trim();
      if (name) store.set(LS.name, name);
    }

    const d = todayKey();
    const tf = { hour:'2-digit', minute:'2-digit', second:'2-digit' };
    const rec = {
      name: name,
      date: d,
      menu: item.name,                                  // 種目
      type: item.mode === 'voice' ? '音声' : 'タップ',  // 入力方式
      start: new Date(session.start).toLocaleTimeString('ja-JP', tf),
      end:   new Date().toLocaleTimeString('ja-JP', tf),
      seconds: Math.round((Date.now() - session.start) / 1000),
      voice: session.count,
      manual: session.manual,
      total: total,
      goal: item.goal,
      sent: false,
    };

    // 今日の合計に加算
    const t = dayTotals(d);
    t[item.id] = (t[item.id] || 0) + total;
    store.set(LS.day(d), JSON.stringify(t));

    // 履歴に保存
    const hist = store.json(LS.hist, []);
    hist.push(rec);
    store.set(LS.hist, JSON.stringify(hist.slice(-200)));

    resetUI();
    renderHome();
    show('home');
    await sendUnsent();
  }

  function resetUI() {
    session = null;
    stopRecognition();
    if (wakeLock) { try { wakeLock.release(); } catch(e) {} wakeLock = null; }
    $('startBtn').textContent = 'スタート';
    $('startBtn').classList.remove('stop');
    $('plusBtn').disabled = true;
    $('minusBtn').disabled = true;
    $('finishBtn').disabled = true;
    $('count').textContent = '0';
    $('statusText').textContent = item ? idleText() : '';
    $('heard').textContent = '';
  }

  // ===== GASへ送信（未送信分をまとめて） =====
  let sending = false;
  async function sendUnsent() {
    const url = store.get(LS.gas, '');
    if (!url || sending) return;
    const hist = store.json(LS.hist, []);
    const unsent = hist.filter(r => !r.sent);
    if (unsent.length === 0) return;
    sending = true;
    for (const r of unsent) {
      try {
        await fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(r) });
        r.sent = true;
      } catch(e) { break; } // 電波がないときは次回に持ち越し
    }
    // 送信中に増えた記録を消さないよう、最新の履歴に「送信済み」だけ書き戻す
    const sentKeys = new Set(unsent.filter(r => r.sent).map(r => r.date + r.start + r.menu));
    const latest = store.json(LS.hist, []);
    latest.forEach(r => { if (sentKeys.has(r.date + r.start + r.menu)) r.sent = true; });
    store.set(LS.hist, JSON.stringify(latest));
    sending = false;
  }

  // ===== きょうのひとこと =====
  // 端末に保存し、送信先があればスプレッドシートにも「メモ」の行として送る
  // （同じ日に書き直すと行が増える。あとから届いた行が最新）
  function saveMemo() {
    const d = todayKey();
    const text = $('memoInput').value.trim();
    if (text === store.get(LS.memo(d), '')) { $('memoMsg').textContent = text ? '記録ずみです' : ''; return; }
    store.set(LS.memo(d), text);
    const now = new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const hist = store.json(LS.hist, []);
    hist.push({ name: store.get(LS.name, ''), date: d, menu: 'ひとこと', type: 'メモ', start: now, end: now,
                seconds: 0, voice: 0, manual: 0, total: 0, goal: 0, memo: text, sent: false });
    store.set(LS.hist, JSON.stringify(hist.slice(-200)));
    $('memoMsg').textContent = text ? '記録しました' : 'ひとことを消しました';
    $('memoInput').blur();
    sendUnsent();
  }
  $('memoBtn').addEventListener('click', saveMemo);
  $('memoInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveMemo(); });
  $('memoInput').addEventListener('input', () => { $('memoMsg').textContent = ''; });

  // ===== 1週間の記録 =====
  let weekOffset = 0;   // 0 = 今週、-1 = 先週 …（週は月曜はじまり）

  // ---- グラフ用の集計 ----
  // 達成率 = 「その日やる種目」ごとの（回数÷目標、上限100%）の平均。お休みの種目・日は数えない
  // ※ 目標と曜日は「いまの設定」で計算する（過去の設定は保存していない）
  function weekData(mon, menu, today) {
    const days = [], items = menu.map(m => ({ m: m, total: 0, target: 0 }));
    let sum = 0, cnt = 0;
    for (let i = 0; i < 7; i++) {
      const dt = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
      const t = dayTotals(dateKey(dt));
      let ds = 0, dc = 0;
      menu.forEach((m, k) => {
        const v = t[m.id] || 0;
        if (dueOn(m, dt)) { ds += Math.min(v / m.goal, 1); dc++; items[k].target += m.goal; items[k].total += v; }
        else if (v > 0) items[k].total += v;
      });
      // 週の達成率は「きょうまで」の分で出す（これからの日を分母に入れると、週のとちゅうで低く見えるため）
      if (dt <= today) { sum += ds; cnt += dc; }
      days.push({ dt: dt, rate: dc ? ds / dc : null, future: dt > today, today: dateKey(dt) === dateKey(today) });
    }
    return { rate: cnt ? sum / cnt : null, days: days, items: items.filter(x => x.target > 0 || x.total > 0) };
  }
  // 記録が残っているいちばん古い日（'yyyy-MM-dd'）。なければ null
  function firstRecordDate() {
    let min = null;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf('jr_day_') === 0) { const d = k.slice(7); if (!min || d < min) min = d; }
      }
    } catch(e) {}
    return min;
  }
  const pct = r => Math.round(r * 100);

  function renderCharts(mon, menu, today, thisMon) {
    const w = weekData(mon, menu, today);
    const md = dt => (dt.getMonth() + 1) + '/' + dt.getDate();

    // 1) 週の達成率（リング）＋ 日ごとの達成率（棒）
    const r = w.rate === null ? 0 : w.rate, C = 2 * Math.PI * 42;
    let html = '<div class="card"><div class="top-row">' +
      '<div class="ring' + (w.rate !== null && pct(r) >= 100 ? ' full' : '') + '">' +
      '<svg viewBox="0 0 104 104" role="img" aria-label="週の達成率 ' + pct(r) + 'パーセント">' +
      '<circle class="trk" cx="52" cy="52" r="42" fill="none" stroke-width="10"/>' +
      '<circle class="prg" cx="52" cy="52" r="42" fill="none" stroke-width="10" stroke-linecap="round" ' +
        'stroke-dasharray="' + (C * r).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 52 52)"' + (r <= 0 ? ' opacity="0"' : '') + '/>' +
      '<text x="52" y="60" text-anchor="middle" font-size="24">' + pct(r) + '%</text></svg>' +
      '<div class="cap">' + (weekOffset === 0 ? '今週の達成率<br>（きょうまで）' : 'この週の達成率') + '</div></div>' +
      '<div class="daybars"><h3>日ごとの達成率（%）</h3><div class="db">' +
      w.days.map(d => {
        const rest = d.rate === null, p = rest ? 0 : pct(d.rate);
        return '<div class="db-col' + (rest ? ' rest' : '') + (d.future ? ' future' : '') + (d.today ? ' today' : '') + (!rest && p >= 100 ? ' full' : '') + '">' +
          '<div class="db-val">' + (rest ? '休' : d.future ? '' : p) + '</div>' +
          '<div class="db-trk"><div class="db-fill" style="height:' + (d.future ? 0 : p) + '%"></div></div>' +
          '<div class="db-wd">' + WD[d.dt.getDay()] + '</div></div>';
      }).join('') + '</div></div></div></div>';

    // 2) 種目ごとの1週間の合計（目標＝1日の目標 × やる日数）
    if (w.items.length) {
      html += '<div class="card"><h3>種目ごとの合計</h3>' + w.items.map(x => {
        const p = x.target > 0 ? Math.min(100, pct(x.total / x.target)) : 100;
        return '<div class="ib' + (x.target > 0 && x.total >= x.target ? ' full' : '') + '">' +
          '<div class="ib-head"><span>' + esc(x.m.name) + '</span><span class="ib-val">' + x.total +
          (x.target > 0 ? '<small> / ' + x.target + esc(x.m.unit) + '</small>' : '<small>' + esc(x.m.unit) + '</small>') + '</span></div>' +
          '<div class="ib-trk"><div class="ib-fill" style="width:' + p + '%"></div></div></div>';
      }).join('') + '</div>';
    }

    // 3) 週ごとの達成率のうつりかわり（直近8週、記録がある週から）
    const first = firstRecordDate();
    const weeks = [];
    if (first) {
      const fp = first.split('-'), fd = new Date(+fp[0], +fp[1] - 1, +fp[2]);
      const firstMon = new Date(fd.getFullYear(), fd.getMonth(), fd.getDate() - ((fd.getDay() + 6) % 7));
      for (let i = 7; i >= 0; i--) {
        const m = new Date(thisMon.getFullYear(), thisMon.getMonth(), thisMon.getDate() - i * 7);
        if (m >= firstMon) { const d = weekData(m, menu, today); weeks.push({ mon: m, off: -i, rate: d.rate === null ? 0 : d.rate }); }
      }
    }
    html += '<div class="card trend"><h3>週ごとの達成率（%）</h3>';
    if (weeks.length < 2) {
      html += '<div class="chart-note">2週目から、折れ線グラフでくらべられます</div>';
    } else {
      const W = 300, H = 120, L = 26, R = 14, T = 16, B = 22;
      const x = i => L + (W - L - R) * i / (weeks.length - 1), y = v => T + (H - T - B) * (1 - v);
      const pts = weeks.map((k, i) => x(i).toFixed(1) + ',' + y(k.rate).toFixed(1));
      html += '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="週ごとの達成率の折れ線グラフ">' +
        [0, .5, 1].map(v => '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
          '<text x="' + (L - 5) + '" y="' + (y(v) + 3.5) + '" text-anchor="end">' + (v * 100) + '</text>').join('') +
        '<polygon class="area" points="' + x(0) + ',' + y(0) + ' ' + pts.join(' ') + ' ' + x(weeks.length - 1) + ',' + y(0) + '"/>' +
        '<polyline class="line" points="' + pts.join(' ') + '"/>' +
        weeks.map((k, i) => {
          const sel = k.off === weekOffset, last = i === weeks.length - 1;
          return '<circle class="pt' + (sel ? ' sel' : '') + '" cx="' + x(i).toFixed(1) + '" cy="' + y(k.rate).toFixed(1) + '" r="' + (sel ? 5.5 : 4) + '"/>' +
            (sel || last ? '<text class="v" x="' + x(i).toFixed(1) + '" y="' + (y(k.rate) - 9).toFixed(1) + '" text-anchor="' + (last ? 'end' : i === 0 ? 'start' : 'middle') + '">' + pct(k.rate) + '</text>' : '') +
            (i === 0 || last || sel ? '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (last ? 'end' : i === 0 ? 'start' : 'middle') + '">' + md(k.mon) + '</text>' : '') +
            '<circle class="hit" data-off="' + k.off + '" cx="' + x(i).toFixed(1) + '" cy="' + y(k.rate).toFixed(1) + '" r="16"><title>' + md(k.mon) + 'の週 ' + pct(k.rate) + '%</title></circle>';
        }).join('') + '</svg><div class="chart-note" style="margin-top:6px">点を押すと、その週を表示します</div>';
    }
    html += '</div>';
    $('weekCharts').innerHTML = html;
  }
  function renderWeek() {
    const menu = getMenu();
    const n = new Date();
    const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    const mon = new Date(today.getFullYear(), today.getMonth(), today.getDate() - ((today.getDay() + 6) % 7) + weekOffset * 7);
    const md = dt => (dt.getMonth() + 1) + '/' + dt.getDate();
    let html = '', fullDays = 0, dueDays = 0;
    const thisMon = new Date(today.getFullYear(), today.getMonth(), today.getDate() - ((today.getDay() + 6) % 7));
    renderCharts(mon, menu, today, thisMon);

    for (let i = 0; i < 7; i++) {
      const dt = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
      const key = dateKey(dt);
      const future = dt > today;
      const t = dayTotals(key);
      const st = dayStat(dt, menu);
      const memo = store.get(LS.memo(key), '');
      const full = st.due > 0 && st.done === st.due;
      if (!future && st.due > 0) { dueDays++; if (full) fullDays++; }

      // その日やる種目と、お休みでも記録がある種目を出す
      const chips = menu.filter(m => dueOn(m, dt) || (t[m.id] || 0) > 0).map(m => {
        const v = t[m.id] || 0;
        return '<span class="chip' + (v >= m.goal ? ' ok' : v === 0 ? ' zero' : '') + '">' + esc(m.name) +
               '<b>' + v + '/' + m.goal + '</b></span>';
      }).join('');

      html += '<div class="wk-day' + (full ? ' full' : '') + (key === dateKey(today) ? ' today' : '') + (future ? ' future' : '') + '">' +
        '<div class="wk-head"><span class="wk-date dot">' + md(dt) + '（' + WD[dt.getDay()] + '）</span>' +
        (future || st.due === 0 ? '' : '<span class="wk-stat dot">' + st.done + ' / ' + st.due + (full ? ' 済' : '') + '</span>') + '</div>' +
        (future ? '' : chips ? '<div class="wk-items">' + chips + '</div>' : '<div class="wk-rest">お休み</div>') +
        (memo ? '<div class="wk-memo">' + esc(memo) + '</div>' : '') +
        '</div>';
    }
    const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    $('weekRange').textContent = md(mon) + ' 〜 ' + md(sun);
    $('weekSub').textContent = (weekOffset === 0 ? '今週　' : '') + 'ぜんぶ達成 ' + fullDays + '日 / ' + dueDays + '日';
    $('weekList').innerHTML = html;
    $('weekNext').disabled = weekOffset >= 0;
  }
  $('weekBtn').addEventListener('click', () => { weekOffset = 0; renderWeek(); show('week'); });
  // 折れ線の点を押したら、その週へ
  $('weekCharts').addEventListener('click', e => {
    const h = e.target.closest('.hit');
    if (h) { weekOffset = parseInt(h.dataset.off, 10); renderWeek(); window.scrollTo(0, 0); }
  });
  $('weekBack').addEventListener('click', () => { renderHome(); show('home'); });
  $('weekPrev').addEventListener('click', () => { weekOffset--; renderWeek(); window.scrollTo(0, 0); });
  $('weekNext').addEventListener('click', () => { if (weekOffset < 0) { weekOffset++; renderWeek(); window.scrollTo(0, 0); } });

  // ===== イベント =====
  $('menu').addEventListener('click', e => {
    const b = e.target.closest('.item');
    if (b) openItem(b.dataset.id);
  });

  $('startBtn').addEventListener('click', () => {
    if (!session) startSession();
    else if (item.mode === 'tap') manualPlus();
    else if (recogActive) pauseSession();
    else resumeSession();
  });
  $('plusBtn').addEventListener('click', manualPlus);
  $('minusBtn').addEventListener('click', undoOne);
  $('finishBtn').addEventListener('click', finishSession);

  $('discardBtn').addEventListener('click', () => {
    if (!session) return;
    if (confirm('この回のカウントを記録せずに消します。いいですか？')) { resetUI(); refreshTop(); }
  });

  // きょうの記録を0回に戻す（おためしで数えたあと用）
  // 履歴は消さず、マイナスの「リセット」行を足す ＝ スプレッドシート側の合計も0に合う
  $('resetBtn').addEventListener('click', () => {
    if (session) return;
    const d = todayKey();
    const t = dayTotals(d);
    const prev = t[item.id] || 0;
    if (prev === 0) return;
    if (!confirm(item.name + 'のきょうの記録（' + prev + item.unit + '）を0に戻します。いいですか？')) return;
    t[item.id] = 0;
    store.set(LS.day(d), JSON.stringify(t));
    const now = new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const hist = store.json(LS.hist, []);
    hist.push({ name: store.get(LS.name, ''), date: d, menu: item.name, type: 'リセット', start: now, end: now,
                seconds: 0, voice: 0, manual: 0, total: -prev, goal: item.goal, sent: false });
    store.set(LS.hist, JSON.stringify(hist.slice(-200)));
    refreshTop();
    $('statusText').textContent = '0回に戻しました';
    sendUnsent();
  });

  $('backBtn').addEventListener('click', () => {
    if (session && session.count + session.manual > 0 &&
        !confirm('まだ記録していません。記録せずにもどりますか？')) return;
    resetUI();
    renderHome();
    show('home');
  });

  // ===== 設定ダイアログ =====
  const daysText = days => days.every(x => x) ? '毎日' : (days.map((x, i) => x ? WD[i] : '').join('') || '休み');
  const sumText = m => m.goal + m.unit + '・' + (m.mode === 'voice' ? '声' : 'タップ') + '・' + daysText(m.days);

  // 種目1つぶんの編集カード
  function editorHTML(m, open) {
    const id = esc(m.id);
    return '<details class="ed" data-id="' + id + '"' + (open ? ' open' : '') + '>' +
      '<summary><span class="sname">' + esc(m.name) + '</span><span class="ssum">' + esc(sumText(m)) + '</span></summary>' +
      '<div class="body">' +
      '<label for="name_' + id + '">名前</label>' +
      '<input id="name_' + id + '" class="f-name" type="text" maxlength="20" value="' + esc(m.name) + '">' +
      '<div class="grid3">' +
        '<div><label for="goal_' + id + '">1日の目標</label><input id="goal_' + id + '" class="f-goal" type="number" inputmode="numeric" min="1" value="' + m.goal + '"></div>' +
        '<div><label for="unit_' + id + '">単位</label><input id="unit_' + id + '" class="f-unit" type="text" maxlength="4" value="' + esc(m.unit) + '"></div>' +
        '<div><label for="intv_' + id + '">最短間隔(秒)</label><input id="intv_' + id + '" class="f-intv" type="number" inputmode="decimal" step="0.1" min="0.5" value="' + m.intv + '"></div>' +
      '</div>' +
      '<label>数え方</label>' +
      '<div class="seg" role="group" aria-label="数え方">' +
        '<button type="button" data-v="voice" aria-pressed="' + (m.mode === 'voice') + '">声で数える</button>' +
        '<button type="button" data-v="tap" aria-pressed="' + (m.mode === 'tap') + '">タップ</button>' +
      '</div>' +
      '<label>やる曜日</label>' +
      '<div class="days" role="group" aria-label="やる曜日">' +
        [0,1,2,3,4,5,6].map(i => '<button type="button" data-d="' + i + '" aria-pressed="' + (m.days[i] ? 'true' : 'false') + '">' + WD[i] + '</button>').join('') +
      '</div>' +
      '<button type="button" class="del">この種目を削除</button>' +
      '</div></details>';
  }

  // 編集カードの入力内容を読み取る
  function readEditor(el) {
    return normItem({
      id: el.dataset.id,
      name: el.querySelector('.f-name').value,
      unit: el.querySelector('.f-unit').value,
      goal: el.querySelector('.f-goal').value,
      intv: el.querySelector('.f-intv').value,
      mode: el.querySelector('.seg [aria-pressed="true"]').dataset.v,
      days: [0,1,2,3,4,5,6].map(i => el.querySelector('.days [data-d="' + i + '"]').getAttribute('aria-pressed') === 'true' ? 1 : 0),
    });
  }
  function refreshSummary(el) {
    const m = readEditor(el);
    el.querySelector('.sname').textContent = m.name;
    el.querySelector('.ssum').textContent = sumText(m);
  }

  $('gearBtn').addEventListener('click', () => {
    $('nickName').value = store.get(LS.name, '');
    $('gasUrl').value = store.get(LS.gas, '');
    $('menuEdit').innerHTML = getMenu().map(m => editorHTML(m, false)).join('');
    const hasGas = !!store.get(LS.gas, '');
    const hist = store.json(LS.hist, []).slice(-30).reverse();
    $('histList').innerHTML = hist.map(r =>
      '<div class="' + (r.sent || !hasGas ? '' : 'unsent') + '">' +
      esc(r.date.slice(5)) + ' ' + esc(r.start.slice(0, 5)) + '　' + esc(r.menu) + ' ' +
      (r.type === 'メモ' ? '「' + esc(r.memo || '') + '」' :
       r.type === 'リセット' ? '0に戻す（' + r.total + '）' : r.total + '（' + Math.floor(r.seconds / 60) + '分' + (r.seconds % 60) + '秒）') +
      (r.sent || !hasGas ? '' : '　未送信') + '</div>'
    ).join('') || '<div>まだ記録がありません</div>';
    $('settingsDlg').showModal();
    $('settingsDlg').scrollTop = 0;
  });

  // 編集カード内のボタン：数え方の切り替え／曜日のオンオフ／削除
  $('menuEdit').addEventListener('click', e => {
    const ed = e.target.closest('.ed');
    if (!ed) return;
    const seg = e.target.closest('.seg button');
    const day = e.target.closest('.days button');
    if (seg) {
      ed.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b === seg ? 'true' : 'false'));
      refreshSummary(ed);
    } else if (day) {
      day.setAttribute('aria-pressed', day.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      refreshSummary(ed);
    } else if (e.target.closest('.del')) {
      const nm = ed.querySelector('.f-name').value.trim() || 'この種目';
      // これまでの記録（履歴・送信済みの行）は消えない。メニューから外すだけ
      if (confirm('「' + nm + '」をメニューから削除します。いいですか？')) ed.remove();
    }
  });
  $('menuEdit').addEventListener('input', e => {
    const ed = e.target.closest('.ed');
    if (ed) refreshSummary(ed);
  });

  $('addItem').addEventListener('click', () => {
    const m = normItem({ id: 'c' + Date.now().toString(36), name: '新しい種目', unit: '回', goal: 10, mode: 'tap', intv: 1.2 });
    $('menuEdit').insertAdjacentHTML('beforeend', editorHTML(m, true));
    const ed = $('menuEdit').lastElementChild;
    ed.scrollIntoView({ block: 'center' });
    const f = ed.querySelector('.f-name');
    f.focus(); f.select();
  });

  function saveSettings() {
    store.set(LS.name, $('nickName').value.trim());
    store.set(LS.gas, $('gasUrl').value.trim());
    const list = Array.from($('menuEdit').querySelectorAll('.ed')).map(readEditor);
    store.set(LS.menu, JSON.stringify(list));
    $('settingsDlg').close();
    renderHome();
    sendUnsent();
  }
  $('closeDlg').addEventListener('click', saveSettings);
  $('closeTop').addEventListener('click', saveSettings);

  // ===== 初期化 =====
  // 配布リンク対応：?gas=…&name=… が付いていたら自動で設定に取り込む
  const qp = new URLSearchParams(location.search);
  if (qp.get('gas'))  store.set(LS.gas,  qp.get('gas').trim());
  if (qp.get('name')) store.set(LS.name, qp.get('name').trim());

  renderHome();
  sendUnsent();
  // 日付が変わったまま開きっぱなしのとき、もどってきたら表示を更新
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !session && $('homeView').classList.contains('on')) renderHome();
  });
})();
</script>
</body>
</html>
